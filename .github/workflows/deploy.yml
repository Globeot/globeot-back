name: Deploy to EC2 (SSM)

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write   # OIDC로 AWS 역할을 assume 하기 위해 필요
  contents: read

env:
  AWS_REGION: ap-northeast-2
  DEPLOY_BUCKET: globeot-deploy-080403790659
  INSTANCE_ID: i-0e2b05169f5203845

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew clean bootJar -x test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::080403790659:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifacts to S3
        run: |
          JAR=$(ls build/libs/*.jar | grep -v plain | head -n1)
          echo "Uploading $JAR"
          aws s3 cp "$JAR" "s3://${DEPLOY_BUCKET}/app.jar"
          aws s3 cp scripts/deploy-remote.sh "s3://${DEPLOY_BUCKET}/deploy-remote.sh"

      - name: Deploy via SSM
        run: |
          cat > ssm-input.json <<JSON
          {
            "InstanceIds": ["${INSTANCE_ID}"],
            "DocumentName": "AWS-RunShellScript",
            "Comment": "Deploy globeot-back",
            "Parameters": {
              "commands": [
                "set -e",
                "aws s3 cp s3://${DEPLOY_BUCKET}/deploy-remote.sh /tmp/deploy-remote.sh",
                "chmod +x /tmp/deploy-remote.sh",
                "runuser -l ec2-user -c 'bash /tmp/deploy-remote.sh'"
              ]
            }
          }
          JSON

          CMD_ID=$(aws ssm send-command --cli-input-json file://ssm-input.json \
            --query Command.CommandId --output text)
          echo "SSM Command ID: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --query Status --output text)

          echo "===== Remote STDOUT ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "===== Remote STDERR ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text

          echo "Final status: $STATUS"
          test "$STATUS" = "Success"
